# Example /etc/bleproxyd.conf for a router on a boat, with Home Assistant at home
# reached over WireGuard. Every setting is shown; change the addresses and devices.
#
# One setting per line. "#" starts a comment, including inside a device name.
# Check a config with: bleproxyd check-config -c /etc/bleproxyd.conf

# --- ESP32 -------------------------------------------------------------------

# Serial device of the ESP32, glob allowed. Default: /dev/ttyACM*
serial          /dev/ttyACM*

# --- Home Assistant ----------------------------------------------------------

# Address for the ESPHome API, as ip:port or :port for all interfaces.
# Default: :6053
# In this example the host device has IP 192.168.1.1
listen          192.168.1.1:6053

# Clients allowed to connect, as addresses or CIDRs, space or comma separated
# or on repeated lines, up to 16 in total. If there are none, ANY client can connect.
# In this example, a single server on boat's LAN (192.168.0.10) and the home network (10.8.0.0) are allowed
allow_from      192.168.0.10
allow_from      10.8.0.0/24

# ESPHome hostname, up to 31 characters. Default: boat-ble-proxy
name            boat-ble-proxy
# Name shown in Home Assistant, up to 63 characters. Default: Boat BLE Proxy
friendly_name   Boat BLE Proxy

# --- Forwarding --------------------------------------------------------------

# Durations take ms, s, m or h; a bare number is seconds.

# How often batched adverts are sent, at least 10ms. Default: 1s
flush_interval  1s
# Each device is sent at most this often. Default: 10s
min_interval    10s
# Unchanged devices are re-sent this often, so Home Assistant doesn't mark them
# unavailable after about 15 minutes of silence. Default: 2m
keepalive       2m

# Only these devices are forwarded, up to 64, with names up to 47 characters.
# Find more with: bleproxyd discover -t 30 (stop the service first)
device  00:11:22:33:44:01  Victron solar charger
device  00:11:22:33:44:02  Saloon RuuviTag
device  00:11:22:33:44:03  Deck RuuviTag
device  00:11:22:33:44:04  Fridge SwitchBot

# Forward everything heard, for bench testing only: on a marina or campsite this
# includes every nearby device. Default: no
# forward_all   yes

# --- Remote reflashing -------------------------------------------------------

# RFC 2217 bridge used by tools/flash-remote.sh. Default: :4000
# In this example the host device has primary IP 192.168.1.1
maintenance_listen      192.168.1.1:4000

# Clients allowed to reflash, in the same format as allow_from. If there are
# none, the bridge refuses to start and tools/flash-remote.sh can't work.
# In this flashing allowed from any device on home network 10.8.0.0
maintenance_allow_from  10.8.0.0/24
